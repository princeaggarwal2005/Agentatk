[project]
name = "agentatk"
version = "0.1.0"
description = "Autonomous AI Agent Security Researcher & Verification Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]

[project.scripts]
tester = "agentatk.cli:main"
agentatk = "agentatk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentatk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["targets", "runs", ".temp_overlays", ".pytest_tmp", "node_modules", ".git"]
addopts = "--basetemp=runs/.pytest_tmp -p no:cacheprovider"